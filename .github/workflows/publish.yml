name: Publish to NuGet

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # OIDC token for nuget.org Trusted Publishing
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build src/XperienceCommunity.FieldPermissions/XperienceCommunity.FieldPermissions.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: dotnet pack src/XperienceCommunity.FieldPermissions/XperienceCommunity.FieldPermissions.csproj --configuration Release --no-build --output nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived nuget.org API key.
      # Requires a trusted publishing policy on nuget.org (owner roeldeb, repository
      # XperienceCommunity-FieldPermissions, workflow file publish.yml).
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: roeldeb

      - name: Publish to NuGet
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
